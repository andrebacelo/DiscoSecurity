<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disco Security</title>
  <style>
    /* Fonte pixel local (não depende de internet). O nome 'Press Start 2P'
       é o que usamos depois no Phaser (fontFamily). */
    @font-face {
      font-family: 'Press Start 2P';
      src: url('src/assets/fonts/PressStart2P-Regular.ttf') format('truetype');
      font-display: block;
    }
    html, body { margin: 0; height: 100%; background: #15151f; }
    /* O contentor ocupa a janela toda; o Phaser (Scale.FIT) centra e ajusta. */
    #game { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="error-log" style="position: absolute; top: 0; left: 0; background: rgba(255,0,0,0.8); color: white; padding: 10px; font-family: monospace; white-space: pre-wrap; display: none; z-index: 9999;"></div>
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const log = document.getElementById('error-log');
      log.style.display = 'block';
      log.innerHTML += 'ERROR: ' + msg + '\n' + (error && error.stack ? error.stack : '') + '\n\n';
      return false;
    };
  </script>

  <!-- Phaser 3 fixado na 3.90.0 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
  <!-- Objetos primeiro (as cenas usam-nos), depois as cenas, main.js por último. -->
  <script src="src/i18n.js"></script>
  <script src="src/som.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/objects/Cliente.js"></script>
  <script src="src/scenes/CenaPorta.js"></script>
  <script src="src/scenes/CenaPerseguicao.js"></script>
  <script src="src/scenes/CenaPausa.js"></script>
  <script src="src/scenes/GameOver.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
